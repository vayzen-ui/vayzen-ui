<header class="header">
  <div class="brand">
    <button
      type="button"
      class="sidebar-toggle-btn"
      (click)="sidebarService.toggle()"
      [class.active]="sidebarService.isOpen()"
      [attr.aria-label]="sidebarService.isOpen() ? 'Ocultar barra lateral' : 'Mostrar barra lateral'"
      [title]="sidebarService.isOpen() ? 'Ocultar barra lateral (Ctrl+B)' : 'Mostrar barra lateral (Ctrl+B)'"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a routerLink="/" class="logo">Vayzen UI</a>
    <span class="badge">v0.0.1</span>
  </div>
  <div class="actions">
    <button type="button" class="theme-toggle" (click)="themeService.toggleTheme()">
      Tema: {{ themeService.currentTheme() }}
    </button>
  </div>
</header>
