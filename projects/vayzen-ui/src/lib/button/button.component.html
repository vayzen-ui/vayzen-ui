<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  [attr.aria-label]="computedAriaLabel()"
  [class]="buttonClasses()"
  (click)="handleClick($event)"
>
  <!-- Spinner nativo SVG cuando loading es true -->
  @if (loading()) {
    <span class="vz-btn__spinner" role="status" aria-label="Cargando...">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.25" />
        <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round" />
      </svg>
    </span>
  }

  <!-- Icono (en modo iconOnly o a la izquierda) -->
  @if (icon() && (iconOnly() || iconPosition() === 'left') && !loading()) {
    <span class="vz-btn__icon" [class.vz-btn__icon--left]="!iconOnly()" aria-hidden="true">
      <ng-container [ngTemplateOutlet]="iconTpl" [ngTemplateOutletContext]="{ name: icon() }" />
    </span>
  }

  <!-- Contenido proyectado (solo cuando no es iconOnly con icono prefijado) -->
  @if (!iconOnly() || !icon()) {
    <span class="vz-btn__content" [class.vz-btn__content--hidden]="loading() && iconOnly()">
      <ng-content />
    </span>
  }

  <!-- Icono sufijo a la derecha (solo en botones estándar con texto) -->
  @if (icon() && !iconOnly() && iconPosition() === 'right' && !loading()) {
    <span class="vz-btn__icon vz-btn__icon--right" aria-hidden="true">
      <ng-container [ngTemplateOutlet]="iconTpl" [ngTemplateOutletContext]="{ name: icon() }" />
    </span>
  }

  <!-- Badge contador de notificaciones o estado -->
  @if (badge() !== undefined && badge() !== null) {
    <span class="vz-btn__badge" [class]="'vz-btn__badge--' + effectiveBadgeVariant()">
      {{ badge() }}
    </span>
  }
</button>

<ng-template #iconTpl let-name="name">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    @switch (name) {
      @case ('plus') {
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      }
      @case ('check') {
        <polyline points="20 6 9 17 4 12" />
      }
      @case ('arrow-right') {
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      }
      @case ('download') {
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      }
      @case ('trash') {
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      }
      @case ('search') {
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      }
      @case ('settings') {
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
      }
      @case ('refresh') {
        <polyline points="23 4 23 10 17 10" />
        <polyline points="1 20 1 14 7 14" />
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
      }
      @case ('external') {
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      }
      @case ('mail') {
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
        <polyline points="22,6 12,13 2,6" />
      }
      @case ('heart') {
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      }
      @case ('edit') {
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      }
      @case ('filter') {
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
      }
      @default {
        <circle cx="12" cy="12" r="4" />
      }
    }
  </svg>
</ng-template>
